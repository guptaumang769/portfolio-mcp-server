services:
  portfolio-mcp-server:
    build: .
    ports:
      - "8093:8093"
    environment:
      BOOKMYSHOW_BASE_URL: http://host.docker.internal:8080
      UBER_BASE_URL: http://host.docker.internal:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
